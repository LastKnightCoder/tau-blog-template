name: 发布博客模板

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: 核对发布标签
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import fs from 'node:fs'; const {version}=JSON.parse(fs.readFileSync('package.json','utf8')); if(process.env.RELEASE_TAG !== 'v'+version) throw Error('标签与版本号不一致');"
      - name: 等待 npm 完成新版本处理
        timeout-minutes: 30
        run: |
          package=$(node -p "require('./package.json').dependencies['@tau/blog'].replace(/^npm:/, '')")
          for attempt in $(seq 1 60); do
            if npm view "$package" version --registry=https://registry.npmjs.org; then
              exit 0
            fi
            echo "npm 正在处理新版本，30 秒后重试（$attempt/60）"
            sleep 30
          done
          echo "npm 新版本尚未可用，请待其公开后重新运行工作流"
          exit 1
      - name: 安装固定依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm check
      - name: 行为测试
        run: pnpm test
      - name: 构建模板
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: tau-blog-template
          path: output/tau.blog-*.zip
          if-no-files-found: error
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" output/tau.blog-*.zip --verify-tag --title "Tau 博客 $RELEASE_TAG" --generate-notes
      - name: 提交到 Tau 插件中心
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PORTAL_API: https://plugins-api.taunote.app
        run: |
          archive=$(ls output/tau.blog-*.zip)
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$PORTAL_API" | jq -r .value)
          echo "::add-mask::$token"
          status=$(curl -sS -o portal-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/zip" \
            --data-binary "@$archive" "$PORTAL_API/v1/ci/releases")
          cat portal-response.json; echo
          if [ "$status" = "404" ]; then
            echo "::warning::模板尚未在插件中心首次提交，请先在 https://plugins.taunote.app 网页提交一次以绑定仓库"
            exit 0
          fi
          test "$status" -lt 300
