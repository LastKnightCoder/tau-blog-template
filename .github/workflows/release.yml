name: 发布博客模板

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: 核对发布标签
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import fs from 'node:fs'; const {version}=JSON.parse(fs.readFileSync('package.json','utf8')); if(process.env.RELEASE_TAG !== 'v'+version) throw Error('标签与版本号不一致');"
      - name: 安装固定依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm check
      - name: 行为测试
        run: pnpm test
      - name: 构建模板
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: tau-blog-template
          path: output/tau.blog-*.zip
          if-no-files-found: error
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" output/tau.blog-*.zip --verify-tag --title "Tau 博客 $RELEASE_TAG" --generate-notes
